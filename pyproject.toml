[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "killcord"
version = "0.1.0"
description = "Spending caps, rate limits, a big red pause button — and safe resume — for any agent loop."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Ketrium Labs" }]
keywords = ["ai-agents", "guardrails", "safety", "kill-switch", "rate-limiting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.9",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "jinja2>=3.1", "httpx>=0.27"]
notify = ["httpx>=0.27"]
openai = ["httpx>=0.27"]
anthropic = ["httpx>=0.27"]
langchain = ["langchain-core>=0.3"]
ledger = ["httpx>=0.27"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "hypothesis>=6.115",
  "mypy>=1.13",
  "ruff>=0.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "jsonschema[format]>=4.23",
]

[project.scripts]
killcord = "killcord.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/killcord"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["killcord"]

[[tool.mypy.overrides]]
module = ["langchain_core.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# langchain_core ships no py.typed marker, so BaseCallbackHandler resolves to
# Any and subclassing it trips disallow_subclassing_any under strict mode.
module = ["killcord.adapters.langchain"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/killcord/core", "src/killcord/snapshot"]
