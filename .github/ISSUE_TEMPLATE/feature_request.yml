name: Feature request
description: Suggest something new for killcord
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: checkboxes
    id: scope-check
    attributes:
      label: Scope check
      options:
        - label: I've checked plan.md's MVP cut-line — this isn't dashboard analytics, multi-agent orchestration, or a policy DSL
          required: true
